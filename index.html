
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>vishvara.design</title>
      <style>body { margin: 0; } #root { min-height: 100vh; }</style>
      <link rel="icon" id="favicon" href="/heart.svg" type="image/svg+xml" />
      <script>
        (function () {
          var icons = ['/heart.svg', '/star.svg'];
          var current = 0;
          var link = document.getElementById('favicon');
          setInterval(function () {
            current ^= 1;
            link.href = icons[current];
          }, 200);
        })();
      </script>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Sora:wght@500;700&display=swap" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
