<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     width="100%"
     height="100%"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <!-- Sky -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010508"/>
      <stop offset="55%" stop-color="#061220"/>
      <stop offset="100%" stop-color="#0B1D38"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#EDE5D8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EDE5D8" stop-opacity="0"/>
    </radialGradient>

    <!-- Crescent mask -->
    <mask id="crescentMask">
      <rect width="100%" height="100%" fill="black"/>
      <circle cx="700" cy="80" r="24" fill="white"/>
      <circle cx="712" cy="72" r="22" fill="black"/>
    </mask>

    <!-- Nebula blur -->
    <filter id="blur80">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Nebulas -->
  <circle cx="150" cy="180"
          r="160"
          fill="#F2A7C4"
          opacity="0.02"
          filter="url(#blur80)"/>

  <circle cx="650" cy="160"
          r="180"
          fill="#6D1F2A"
          opacity="0.034"
          filter="url(#blur80)"/>

  <!-- Stars -->
  <g fill="#fff">

    <!-- Row 1 -->
    <circle cx="20" cy="50" r="0.8"><animate attributeName="opacity" values="1;0.05;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="45" cy="80" r="1.2"><animate attributeName="opacity" values="1;0.05;1" dur="4.2s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="40" r="0.5"><animate attributeName="opacity" values="1;0.05;1" dur="3.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="100" r="1.6"><animate attributeName="opacity" values="1;0.05;1" dur="4.8s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="60" r="0.4"><animate attributeName="opacity" values="1;0.05;1" dur="2.7s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="120" r="1"><animate attributeName="opacity" values="1;0.05;1" dur="3.2s" begin="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="185" cy="35" r="1.5"><animate attributeName="opacity" values="1;0.05;1" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="0.7"><animate attributeName="opacity" values="1;0.05;1" dur="2.9s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="65" r="1.8"><animate attributeName="opacity" values="1;0.05;1" dur="3.9s" begin="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="115" r="0.6"><animate attributeName="opacity" values="1;0.05;1" dur="4.1s" begin="1.2s" repeatCount="indefinite"/></circle>

    <circle cx="300" cy="55" r="1.1"><animate attributeName="opacity" values="1;0.05;1" dur="2.6s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="325" cy="135" r="0.9"><animate attributeName="opacity" values="1;0.05;1" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="85" r="1.7"><animate attributeName="opacity" values="1;0.05;1" dur="4.9s" begin="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="50" r="0.4"><animate attributeName="opacity" values="1;0.05;1" dur="2.1s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="405" cy="125" r="1.3"><animate attributeName="opacity" values="1;0.05;1" dur="3.1s" begin="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="75" r="0.8"><animate attributeName="opacity" values="1;0.05;1" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="95" r="1.6"><animate attributeName="opacity" values="1;0.05;1" dur="4.6s" begin="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="485" cy="45" r="0.5"><animate attributeName="opacity" values="1;0.05;1" dur="3.7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="140" r="1.4"><animate attributeName="opacity" values="1;0.05;1" dur="4.3s" begin="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="535" cy="90" r="0.7"><animate attributeName="opacity" values="1;0.05;1" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>

    <circle cx="560" cy="55" r="1.5"><animate attributeName="opacity" values="1;0.05;1" dur="3.4s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="120" r="0.6"><animate attributeName="opacity" values="1;0.05;1" dur="4.7s" begin="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="80" r="1.2"><animate attributeName="opacity" values="1;0.05;1" dur="2.5s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40" r="1.8"><animate attributeName="opacity" values="1;0.05;1" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="665" cy="105" r="0.5"><animate attributeName="opacity" values="1;0.05;1" dur="3.3s" begin="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="150" r="1"><animate attributeName="opacity" values="1;0.05;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="715" cy="55" r="1.4"><animate attributeName="opacity" values="1;0.05;1" dur="4.8s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="95" r="0.7"><animate attributeName="opacity" values="1;0.05;1" dur="3.8s" begin="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="765" cy="65" r="1.6"><animate attributeName="opacity" values="1;0.05;1" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="785" cy="125" r="0.4"><animate attributeName="opacity" values="1;0.05;1" dur="4.4s" begin="2.8s" repeatCount="indefinite"/></circle>

    <!-- extra stars -->
    <g opacity="0.9">
      <circle cx="60" cy="180" r="1"/>
      <circle cx="140" cy="170" r="0.5"/>
      <circle cx="220" cy="200" r="1.5"/>
      <circle cx="310" cy="180" r="0.8"/>
      <circle cx="390" cy="210" r="1.2"/>
      <circle cx="470" cy="190" r="0.6"/>
      <circle cx="550" cy="170" r="1.4"/>
      <circle cx="640" cy="200" r="0.7"/>
      <circle cx="720" cy="180" r="1"/>
      <circle cx="95" cy="230" r="1.6"/>
      <circle cx="180" cy="250" r="0.5"/>
      <circle cx="260" cy="220" r="1"/>
      <circle cx="350" cy="245" r="1.8"/>
      <circle cx="450" cy="225" r="0.7"/>
      <circle cx="540" cy="235" r="1.2"/>
      <circle cx="620" cy="250" r="0.5"/>
      <circle cx="710" cy="220" r="1.3"/>
      <circle cx="770" cy="245" r="0.8"/>
    </g>
  </g>

  <!-- Moon glow -->
  <circle cx="700" cy="80"
          r="64"
          fill="url(#moonGlow)"/>

  <!-- Crescent moon -->
  <circle cx="700"
          cy="80"
          r="24"
          fill="#EDE5D8"
          mask="url(#crescentMask)"/>

  <!-- Far hills -->
  <path fill="#060E09"
        d="M0 300
           C80 270 140 285 220 295
           C320 308 430 260 530 280
           C620 300 710 275 800 290
           L800 500 L0 500 Z"/>

  <!-- Mid hills -->
  <path fill="#0A1A0F"
        d="M0 340
           C90 295 190 325 280 350
           C390 375 500 300 610 325
           C700 345 760 320 800 335
           L800 500 L0 500 Z"/>

  <!-- Near ground -->
  <path fill="#0E2A1C"
        d="M0 395
           C70 365 150 390 250 410
           C360 430 470 380 590 400
           C700 420 760 390 800 405
           L800 500 L0 500 Z"/>

  <!-- Grass tufts -->
  <g fill="#143821">
    <path d="M35 392 l4 -10 l4 10 Z"/><path d="M42 393 l3 -8 l3 8 Z"/>
    <path d="M90 398 l4 -11 l4 11 Z"/><path d="M98 399 l3 -9 l3 9 Z"/>
    <path d="M145 401 l5 -12 l5 12 Z"/><path d="M154 402 l3 -8 l3 8 Z"/>
    <path d="M200 404 l4 -10 l4 10 Z"/><path d="M208 405 l3 -7 l3 7 Z"/>
    <path d="M260 410 l5 -11 l5 11 Z"/><path d="M268 411 l3 -8 l3 8 Z"/>
    <path d="M315 414 l4 -10 l4 10 Z"/><path d="M322 415 l3 -8 l3 8 Z"/>
    <path d="M375 416 l5 -12 l5 12 Z"/><path d="M384 417 l3 -9 l3 9 Z"/>
    <path d="M430 412 l4 -11 l4 11 Z"/><path d="M438 413 l3 -8 l3 8 Z"/>
    <path d="M485 409 l5 -10 l5 10 Z"/><path d="M493 410 l3 -7 l3 7 Z"/>
    <path d="M545 405 l4 -12 l4 12 Z"/><path d="M553 406 l3 -8 l3 8 Z"/>
    <path d="M605 402 l5 -11 l5 11 Z"/><path d="M614 403 l3 -8 l3 8 Z"/>
    <path d="M665 399 l4 -10 l4 10 Z"/><path d="M673 400 l3 -7 l3 7 Z"/>
    <path d="M725 397 l5 -12 l5 12 Z"/><path d="M734 398 l3 -8 l3 8 Z"/>
    <path d="M775 394 l4 -10 l4 10 Z"/><path d="M782 395 l3 -7 l3 7 Z"/>
  </g>

</svg>